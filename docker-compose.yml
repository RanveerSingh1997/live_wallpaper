services:
  wallaza-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wallaza-service:latest
    container_name: wallaza-service
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - WALLAZA_API_KEY=${WALLAZA_API_KEY:-demo_key}
      - WALLAZA_BASE_URL=${WALLAZA_BASE_URL:-https://api.wallaza.com/v1}
      - JAVA_OPTS=${JAVA_OPTS:--XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M

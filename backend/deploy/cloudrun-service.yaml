apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: wallaza-service
  labels:
    cloud.googleapis.com/location: us-central1
    app.kubernetes.io/name: wallaza-service
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/wallora-prod/wallaza-service:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: WALLAZA_BASE_URL
              value: "https://api.wallaza.com/v1"
            - name: JAVA_OPTS
              value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
            - name: WALLAZA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wallaza-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3

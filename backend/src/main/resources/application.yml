server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: wallaza-service
  cache:
    type: caffeine

# Wallaza Client Configuration
wallaza:
  enabled: true
  api-key: ${WALLAZA_API_KEY:demo_key}
  base-url: ${WALLAZA_BASE_URL:https://api.wallaza.com/v1}
  connect-timeout: 5s
  read-timeout: 15s

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# Actuator Health Checks & Telemetry
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.wallaza: DEBUG
    org.springframework.web: INFO

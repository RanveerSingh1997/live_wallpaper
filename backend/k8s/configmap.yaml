apiVersion: v1
kind: ConfigMap
metadata:
  name: wallaza-service-config
  namespace: wallora
  labels:
    app.kubernetes.io/name: wallaza-service
    app.kubernetes.io/part-of: wallora-platform
data:
  SERVER_PORT: "8080"
  WALLAZA_BASE_URL: "https://api.wallaza.com/v1"
  JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"

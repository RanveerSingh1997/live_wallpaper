apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallaza-service-ingress
  namespace: wallora
  labels:
    app.kubernetes.io/name: wallaza-service
    app.kubernetes.io/part-of: wallora-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
    - hosts:
        - api.wallora.app
      secretName: wallora-api-tls
  rules:
    - host: api.wallora.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wallaza-service
                port:
                  number: 80

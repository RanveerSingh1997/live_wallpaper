apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wallaza-service-hpa
  namespace: wallora
  labels:
    app.kubernetes.io/name: wallaza-service
    app.kubernetes.io/part-of: wallora-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wallaza-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
